plugins {
    id 'com.android.application'
}

// 签名配置读仓库根目录的 keystore.properties（本地文件，已被 .gitignore 排除）；密钥本身放在仓库外，不入库
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.vtp.touchpad'
    compileSdk 36

    defaultConfig {
        applicationId "com.vtp.touchpad"
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName "1.7.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 离线构建时 lint-gradle 未进缓存会导致 lintVitalRelease 失败；本项目不依赖 lint 门禁
    lint {
        checkReleaseBuilds false
    }

    // kotlin-stdlib 是 AGP 带进来的传递依赖，本项目纯 Java 不用它，
    // R8 会把类裁干净，这里再把随之打包的 .kotlin_builtins 等资源一起剔掉
    packaging {
        resources {
            excludes += ['kotlin/**', 'DebugProbesKt.bin', 'META-INF/*.kotlin_module']
        }
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 纯 Java、无反射，可以直接交给 R8：未引用的类与资源一起剔掉，包体最小
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 没有 keystore.properties 时退回 debug 签名，保证别人 clone 下来也能编
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}
