plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vtp.touchpad'
    compileSdk 36

    defaultConfig {
        applicationId "com.vtp.touchpad"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
